<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRC Declinator</title>
  <link rel="icon" href="#">
  <link rel="stylesheet" href="css/select.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vocabulary.js" defer></script>
  <script src="js/declensions.js" defer></script>
  <script src="js/select.js" defer></script>
  <script src="js/switch.js" defer></script>
  <script src="js/keyboard.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main id="root">
    <div class="keyboard">
      <button class="d-btn case">Ā</button>
      <div class="keyboard__switcher"></div>
      <div class="keyboard__body" id="kb">
        <div class="keyboard__line">
          <div class="keyboard__key">α</div>
          <div class="keyboard__key">ε</div>
          <div class="keyboard__key">η</div>
          <div class="keyboard__key">ι</div>
          <div class="keyboard__key">ο</div>
          <div class="keyboard__key">υ</div>
          <div class="keyboard__key">ω</div>
        </div>
        <div class="keyboard__line">
          <div class="keyboard__key kbs">ἁ</div>
          <div class="keyboard__key kbs">ά</div>
          <div class="keyboard__key kbs">ἅ</div>
          <div class="keyboard__key kbs">ᾶ</div>
          <div class="keyboard__key kbs">ἇ</div>
          <div class="keyboard__key kbs">ᾳ</div>
          <div class="keyboard__key kbs">ᾷ</div>
          <div class="keyboard__key kbs">ᾱ</div>
          <div class="keyboard__key kbs">ᾱ́</div>
        </div>
      </div>
    </div>
    <div class="block select">
      Déclínátió:
      <div id="select-declention" class="ui-select">
        <button class="ui-select__value" type="button">forte</button>
        <ul class="ui-select__options">
          <li class="ui-select__option" value="0">forte</li>
          <li class="ui-select__option" value="1" selected>1</li>
          <li class="ui-select__option" value="2">2</li>
          <li class="ui-select__option" value="3">3</li>
          <li class="ui-select__option" value="4">pronomina</li>
          <li class="ui-select__option" value="5">numeralia</li>
        </ul>
      </div>
      <button class="d-btn" data-action="gen">Generáre</button>
    </div>
    <div class="block words">
      <div class="word">vocábulum</div>
      <div class="word">tránslátió</div>
    </div>
    <div class="block table">
      <div class="col col-1">
        <div class="row row-1">CASVS</div>
        <div class="row" data-case="Nom"><b class="r-switch"></b><b class="r-case">Nóminátívus:</b></div>
        <div class="row" data-case="Acc"><b class="r-switch"></b><b class="r-case">Accúsátívus:</b></div>
        <div class="row" data-case="Gen"><b class="r-switch"></b><b class="r-case">Genetívus:</b></div>
        <div class="row" data-case="Dat"><b class="r-switch"></b><b class="r-case">Datívus:</b></div>
        <div class="row" data-case="Voc"><b class="r-switch"></b><b class="r-case">Vocátívus:</b></div>
      </div>
      <div class="col">
        <div class="row row-1">SINGVLARIS</div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div class="col">
        <div class="row row-1">PLVRALIS</div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
        <div class="row"><input class="input" type="text" autocapitalize="off" spellcheck="false"></div>
      </div>
    </div>
    <div class="block buttons">
      <button class="d-btn" data-action="check">Probáre</button>
      <button class="d-btn" data-action="toggle">Respónsa</button>
    </div>
  </main>
</body>
</html>
